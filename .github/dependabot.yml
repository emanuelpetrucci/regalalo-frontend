# Actualizaciones periódicas de dependencias. No habilita por sí solo
# las alertas ni las correcciones de seguridad: eso se activa en
# Settings → Security and quality (Dependabot alerts y security updates).
# La etiqueta "dependencies" hay que crearla en el repositorio (no existe hoy).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
