<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No lo vendo — Acceder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #F4F5F6; -webkit-font-smoothing: antialiased; }
  input, button, textarea, select { font-family: inherit; }
  ::placeholder { color: #9AA2AD; }
  a { color: inherit; }
  @media (max-width: 780px) {
    .split-grid { grid-template-columns: 1fr !important; }
    .brand-col  { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

/* ─── TOKENS ──────────────────────────────────────────────────── */
const C = {
  primary:       '#3A7358',
  primaryHov:    '#2D5C45',
  primaryLight:  '#F0F5F2',
  accent:        '#253F72',
  accentLight:   '#EDF0F5',
  bgPage:        '#F4F5F6',
  bgSurface:     '#FFFFFF',
  bgSubtle:      '#E8EAEC',
  fgPrimary:     '#14171A',
  fgSecondary:   '#606A76',
  fgMuted:       '#7C8692',
  fgDisabled:    '#9AA2AD',
  border:        '#D5D9DE',
  error:         '#B33A2A',
  errorBg:       '#FDECEA',
  errorBorder:   '#E8A89E',
  warning:       '#8F5907',
  warningBg:     '#FEF6E7',
  warningBorder: '#EDD090',
  sh1: '0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04)',
  sh2: '0 4px 16px rgba(0,0,0,0.10),0 2px 4px rgba(0,0,0,0.06)',
};
const FD = "'Playfair Display', Georgia, serif";
const FB = "'DM Sans', system-ui, sans-serif";

/* ─── ICONS ───────────────────────────────────────────────────── */
const Ico = ({ sz=16, children }) => (
  <svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const IArrow  = () => <Ico><path d="M19 12H5M12 19l-7-7 7-7"/></Ico>;
const IMail   = () => <Ico sz={22}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Ico>;
const ICheck  = () => <Ico sz={22}><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Ico>;
const IWarn   = () => <Ico><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Ico>;
const ILock   = () => <Ico sz={22}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></Ico>;
const IEye    = ({ off }) => off
  ? <Ico><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></Ico>
  : <Ico><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></Ico>;

/* ─── ALERT BOX ───────────────────────────────────────────────── */
function AlertBox({ variant='error', children }) {
  const v = {
    error:   { bg: C.errorBg,   border: C.errorBorder,   fg: C.error,   icon: <IWarn /> },
    warning: { bg: C.warningBg, border: C.warningBorder, fg: C.warning, icon: <IWarn /> },
  }[variant];
  return (
    <div style={{ background: v.bg, border: `1px solid ${v.border}`, borderRadius: 8,
      padding: '10px 12px', display: 'flex', gap: 8, alignItems: 'flex-start' }}>
      <span style={{ color: v.fg, flexShrink: 0, marginTop: 1 }}>{v.icon}</span>
      <div style={{ fontFamily: FB, fontSize: 13, lineHeight: 1.55, color: v.fg }}>{children}</div>
    </div>
  );
}

/* ─── FIELD INPUT ─────────────────────────────────────────────── */
function FieldInput({ label, type='text', placeholder, value, onChange, error, helper, autoComplete }) {
  const [focused, setFocused] = React.useState(false);
  const [showPwd, setShowPwd] = React.useState(false);
  const isPwd = type === 'password';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
      <label style={{ fontFamily: FB, fontSize: 13, fontWeight: 500, color: C.fgPrimary, lineHeight: 1 }}>{label}</label>
      <div style={{ position: 'relative' }}>
        <input type={isPwd ? (showPwd ? 'text' : 'password') : type}
          placeholder={placeholder} value={value} onChange={onChange}
          autoComplete={autoComplete}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
          style={{ fontFamily: FB, fontSize: 14, color: C.fgPrimary, background: C.bgSurface,
            width: '100%', border: `1.5px solid ${error ? C.error : focused ? C.primary : C.border}`,
            borderRadius: 8, padding: isPwd ? '10px 40px 10px 12px' : '10px 12px',
            outline: 'none',
            boxShadow: focused && !error ? '0 0 0 3px rgba(58,115,88,0.18)' : 'none',
            transition: 'border-color 150ms, box-shadow 150ms' }} />
        {isPwd && (
          <button type="button" tabIndex={-1} onClick={() => setShowPwd(v => !v)}
            style={{ position: 'absolute', right: 11, top: '50%', transform: 'translateY(-50%)',
              background: 'none', border: 'none', cursor: 'pointer',
              color: C.fgMuted, display: 'flex', alignItems: 'center', padding: 2 }}>
            <IEye off={showPwd} />
          </button>
        )}
      </div>
      {(error || helper) && (
        <span style={{ fontFamily: FB, fontSize: 12, color: error ? C.error : C.fgMuted, lineHeight: 1.4 }}>
          {error || helper}
        </span>
      )}
    </div>
  );
}

/* ─── BTN ─────────────────────────────────────────────────────── */
function Btn({ children, variant='primary', fullWidth, onClick, disabled, type='button' }) {
  const [hov, setHov] = React.useState(false);
  const [prs, setPrs] = React.useState(false);
  const v = variant === 'secondary'
    ? { bg: hov && !disabled ? C.primaryLight : C.bgSurface, color: disabled ? C.fgDisabled : C.primary, border: `1.5px solid ${disabled ? C.border : C.primary}` }
    : { bg: disabled ? C.bgSubtle : hov ? C.primaryHov : C.primary, color: disabled ? C.fgDisabled : '#fff', border: 'none' };
  return (
    <button type={type} disabled={disabled} onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => { setHov(false); setPrs(false); }}
      onMouseDown={() => setPrs(true)} onMouseUp={() => setPrs(false)}
      style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
        fontFamily: FB, fontSize: 14, fontWeight: 500, lineHeight: 1,
        background: v.bg, color: v.color, border: v.border || 'none',
        borderRadius: 8, padding: '11px 20px', width: fullWidth ? '100%' : undefined,
        cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.55 : 1,
        transform: prs && !disabled ? 'scale(0.97)' : 'scale(1)',
        transition: 'background 150ms, transform 150ms', outline: 'none' }}>
      {children}
    </button>
  );
}

/* ─── SMALL ATOMS ─────────────────────────────────────────────── */
function BackBtn({ onClick, label='Volver' }) {
  return (
    <button type="button" onClick={onClick}
      style={{ background: 'none', border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', gap: 5,
        color: C.fgSecondary, fontFamily: FB, fontSize: 13,
        padding: '0 0 20px', marginLeft: -2 }}>
      <IArrow /> {label}
    </button>
  );
}
function TxtLink({ children, onClick }) {
  return (
    <button type="button" onClick={onClick}
      style={{ background: 'none', border: 'none', cursor: 'pointer',
        fontFamily: FB, fontSize: 13, fontWeight: 500, color: C.primary, padding: 0 }}>
      {children}
    </button>
  );
}
function RecaptchaNote() {
  return (
    <p style={{ marginTop: 16, textAlign: 'center', fontFamily: FB, fontSize: 11,
      color: C.fgMuted, lineHeight: 1.6 }}>
      Protegido por reCAPTCHA ·{' '}
      <a href="#" style={{ textDecoration: 'underline' }}>Privacidad</a>
      {' · '}
      <a href="#" style={{ textDecoration: 'underline' }}>Condiciones</a>
    </p>
  );
}
function Heading({ children }) {
  return (
    <div style={{ fontFamily: FD, fontSize: 22, fontWeight: 600,
      color: C.fgPrimary, marginBottom: 6 }}>{children}</div>
  );
}
function SubText({ children }) {
  return (
    <p style={{ fontFamily: FB, fontSize: 14, color: C.fgSecondary,
      marginBottom: 24, lineHeight: 1.65 }}>{children}</p>
  );
}
function IconCircle({ bg, color, children }) {
  return (
    <div style={{ width: 52, height: 52, borderRadius: '50%', background: bg,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      margin: '0 auto 20px', color }}>{children}</div>
  );
}

/* ─── AUTH FORM ───────────────────────────────────────────────── */
function AuthForm({ screenTweak, onSuccess }) {
  /* ── All hooks at top ───────────────────────────────────────── */
  const [tab,        setTab]        = React.useState('login');
  const [mode,       setMode]       = React.useState('form');
  // mode: form | forgot | forgot-sent | reset | reset-invalid | reset-done
  const [sessionExp, setSessionExp] = React.useState(false);
  const [apiError,   setApiError]   = React.useState(null);
  const [email,      setEmail]      = React.useState('');
  const [pwd,        setPwd]        = React.useState('');
  const [postal,     setPostal]     = React.useState('');
  const [newPwd,     setNewPwd]     = React.useState('');
  const [confirmPwd, setConfirmPwd] = React.useState('');
  const [errors,     setErrors]     = React.useState({});

  /* ── Sync with tweak screen selector ────────────────────────── */
  React.useEffect(() => {
    setErrors({}); setApiError(null);
    ({
      'login':         () => { setTab('login');    setMode('form');         setSessionExp(false); },
      'register':      () => { setTab('register'); setMode('form');         setSessionExp(false); },
      'forgot':        () => {                     setMode('forgot');       setSessionExp(false); },
      'forgot-sent':   () => {                     setMode('forgot-sent'); setSessionExp(false); },
      'reset':         () => {                     setMode('reset');        setSessionExp(false); },
      'reset-invalid': () => {                     setMode('reset-invalid');setSessionExp(false); },
      'expired':       () => { setTab('login');    setMode('form');         setSessionExp(true);  },
    })[screenTweak]?.();
  }, [screenTweak]);

  /* ── Helpers ────────────────────────────────────────────────── */
  const clrErr  = k => setErrors(p => { const e = {...p}; delete e[k]; return e; });
  const goLogin = ()  => { setTab('login');    setMode('form'); setErrors({}); setApiError(null); setSessionExp(false); };
  const goReg   = ()  => { setTab('register'); setMode('form'); setErrors({}); setApiError(null); };

  /* ── Handlers ───────────────────────────────────────────────── */
  function handleLoginRegister(ev) {
    ev.preventDefault(); setApiError(null);
    const e = {};
    if (!email.trim())                                      e.email  = 'Introduce tu correo electrónico';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))    e.email  = 'El formato del correo no es válido';
    if (!pwd.trim())                                        e.pwd    = 'Introduce tu contraseña';
    else if (tab === 'register' && pwd.length < 8)          e.pwd    = 'Mínimo 8 caracteres';
    if (tab === 'register') {
      if (!postal.trim())                                   e.postal = 'Introduce tu código postal';
      else if (!/^\d{5}$/.test(postal.trim()))              e.postal = 'El código postal debe tener 5 dígitos';
    }
    if (Object.keys(e).length) { setErrors(e); return; }
    onSuccess();
  }

  function handleForgot(ev) {
    ev.preventDefault(); setApiError(null);
    const e = {};
    if (!email.trim())                                      e.email = 'Introduce tu correo electrónico';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))    e.email = 'El formato del correo no es válido';
    if (Object.keys(e).length) { setErrors(e); return; }
    setMode('forgot-sent');
  }

  function handleReset(ev) {
    ev.preventDefault(); setApiError(null);
    const e = {};
    if (!newPwd.trim())                       e.newPwd     = 'Introduce tu nueva contraseña';
    else if (newPwd.length < 8)               e.newPwd     = 'Mínimo 8 caracteres';
    if (!confirmPwd.trim())                   e.confirmPwd = 'Confirma tu contraseña';
    else if (newPwd !== confirmPwd)            e.confirmPwd = 'Las contraseñas no coinciden';
    if (Object.keys(e).length) { setErrors(e); return; }
    setMode('reset-done');
  }

  /* ── RENDER: token inválido ─────────────────────────────────── */
  if (mode === 'reset-invalid') return (
    <div style={{ textAlign: 'center', padding: '8px 0' }}>
      <IconCircle bg={C.errorBg} color={C.error}><ILock /></IconCircle>
      <Heading>Enlace no válido</Heading>
      <SubText>Este enlace ha expirado o ya fue utilizado. Puedes solicitar uno nuevo desde el inicio de sesión.</SubText>
      <Btn variant="secondary" onClick={() => { setMode('forgot'); setErrors({}); }}>
        Solicitar nuevo enlace
      </Btn>
    </div>
  );

  /* ── RENDER: nueva contraseña ───────────────────────────────── */
  if (mode === 'reset') return (
    <div>
      <BackBtn onClick={goLogin} label="Volver al inicio" />
      <Heading>Nueva contraseña</Heading>
      <SubText>Elige una contraseña segura. Debe tener al menos 8 caracteres.</SubText>
      <form onSubmit={handleReset} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <FieldInput label="Nueva contraseña" type="password" placeholder="••••••••"
          value={newPwd} onChange={e => { setNewPwd(e.target.value); clrErr('newPwd'); }}
          error={errors.newPwd} autoComplete="new-password" />
        <FieldInput label="Confirmar contraseña" type="password" placeholder="••••••••"
          value={confirmPwd} onChange={e => { setConfirmPwd(e.target.value); clrErr('confirmPwd'); }}
          error={errors.confirmPwd} autoComplete="new-password" />
        <div style={{ marginTop: 4 }}><Btn type="submit" fullWidth>Guardar contraseña</Btn></div>
      </form>
    </div>
  );

  /* ── RENDER: contraseña actualizada ─────────────────────────── */
  if (mode === 'reset-done') return (
    <div style={{ textAlign: 'center', padding: '12px 0' }}>
      <IconCircle bg={C.primaryLight} color={C.primary}><ICheck /></IconCircle>
      <Heading>Contraseña guardada</Heading>
      <SubText>Tu contraseña ha sido actualizada correctamente. Ya puedes acceder con tus nuevas credenciales.</SubText>
      <Btn fullWidth onClick={goLogin}>Iniciar sesión</Btn>
    </div>
  );

  /* ── RENDER: recuperar contraseña ───────────────────────────── */
  if (mode === 'forgot') return (
    <div>
      <BackBtn onClick={goLogin} />
      <Heading>Recuperar acceso</Heading>
      <SubText>Introduce tu correo y te enviaremos un enlace para recuperar el acceso.</SubText>
      <form onSubmit={handleForgot} style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
        <FieldInput label="Correo electrónico" type="email" placeholder="tu@email.es"
          value={email} onChange={e => { setEmail(e.target.value); clrErr('email'); }}
          error={errors.email} autoComplete="email" />
        <Btn type="submit" fullWidth>Enviar enlace</Btn>
      </form>
      <RecaptchaNote />
    </div>
  );

  /* ── RENDER: email enviado ───────────────────────────────────── */
  if (mode === 'forgot-sent') return (
    <div style={{ textAlign: 'center', padding: '12px 0' }}>
      <IconCircle bg={C.primaryLight} color={C.primary}><IMail /></IconCircle>
      <Heading>Revisa tu bandeja de entrada</Heading>
      <p style={{ fontFamily: FB, fontSize: 14, color: C.fgMuted, marginBottom: 8, lineHeight: 1.65 }}>
        Si ese correo está registrado, recibirás el enlace en breve.
      </p>
      <p style={{ fontFamily: FB, fontSize: 12, color: C.fgMuted, marginBottom: 28, lineHeight: 1.65 }}>
        Comprueba también la carpeta de spam.
      </p>
      <Btn variant="secondary" onClick={goLogin}>Volver al inicio</Btn>
    </div>
  );

  /* ── RENDER: login / registro ────────────────────────────────── */
  return (
    <div>
      {/* Sesión expirada */}
      {sessionExp && (
        <div style={{ marginBottom: 20 }}>
          <AlertBox variant="warning">
            Tu sesión ha caducado. Vuelve a iniciar sesión para continuar.
          </AlertBox>
        </div>
      )}
      {/* Error API */}
      {apiError && (
        <div style={{ marginBottom: 20 }}>
          <AlertBox variant="error">
            {apiError.msg}
            {apiError.cta && (
              <span> <TxtLink onClick={() => { goLogin(); setApiError(null); }}>{apiError.cta}</TxtLink></span>
            )}
          </AlertBox>
        </div>
      )}

      {/* Tabs */}
      <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, marginBottom: 28 }}>
        {[['login','Iniciar sesión'],['register','Crear cuenta']].map(([t, lbl]) => (
          <button key={t} type="button"
            onClick={() => { setTab(t); setErrors({}); setApiError(null); setPwd(''); setPostal(''); }}
            style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer',
              padding: '8px 0 12px', fontFamily: FB, fontSize: 14,
              fontWeight: tab === t ? 600 : 400,
              color: tab === t ? C.primary : C.fgMuted,
              borderBottom: `2px solid ${tab === t ? C.primary : 'transparent'}`,
              marginBottom: -1, transition: 'color 150ms, border-color 150ms' }}>
            {lbl}
          </button>
        ))}
      </div>

      {/* Formulario */}
      <form onSubmit={handleLoginRegister} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <FieldInput label="Correo electrónico" type="email" placeholder="tu@email.es"
          value={email} onChange={e => { setEmail(e.target.value); clrErr('email'); setApiError(null); }}
          error={errors.email} autoComplete="email" />

        <FieldInput label="Contraseña" type="password" placeholder="••••••••"
          value={pwd} onChange={e => { setPwd(e.target.value); clrErr('pwd'); setApiError(null); }}
          error={errors.pwd}
          autoComplete={tab === 'login' ? 'current-password' : 'new-password'} />

        {tab === 'register' && (
          <FieldInput label="Código postal" placeholder="28001"
            value={postal} onChange={e => { setPostal(e.target.value); clrErr('postal'); }}
            error={errors.postal}
            helper={!errors.postal ? 'Para mostrarte objetos a menos de 50 km' : undefined} />
        )}

        {tab === 'login' && (
          <div style={{ textAlign: 'right', marginTop: -4 }}>
            <button type="button"
              onClick={() => { setMode('forgot'); setErrors({}); setApiError(null); }}
              style={{ background: 'none', border: 'none', cursor: 'pointer',
                fontFamily: FB, fontSize: 12, color: C.primary, padding: 0 }}>
              ¿Olvidaste tu contraseña?
            </button>
          </div>
        )}

        <div style={{ marginTop: 4 }}>
          <Btn type="submit" fullWidth>
            {tab === 'login' ? 'Entrar' : 'Crear cuenta'}
          </Btn>
        </div>
      </form>

      <RecaptchaNote />

      {/* Toggle login/register */}
      <div style={{ marginTop: 16, textAlign: 'center', fontFamily: FB, fontSize: 13, color: C.fgMuted }}>
        {tab === 'login' ? '¿Aún no tienes cuenta? ' : '¿Ya tienes cuenta? '}
        <TxtLink onClick={tab === 'login' ? goReg : goLogin}>
          {tab === 'login' ? 'Crear cuenta' : 'Iniciar sesión'}
        </TxtLink>
      </div>
    </div>
  );
}

/* ─── LANGUAGE SELECTOR ──────────────────────────────────────── */
const LANGS = [
  { code: 'es', label: 'Español' },
  { code: 'en', label: 'English' },
  { code: 'ca', label: 'Català'  },
];
function LanguageSelector() {
  const [lang, setLang] = React.useState(() => localStorage.getItem('nlv_lang') || 'es');
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const select = code => { setLang(code); localStorage.setItem('nlv_lang', code); setOpen(false); };
  return (
    <div ref={ref} style={{ position:'relative', flexShrink:0 }}>
      <button onClick={() => setOpen(o => !o)} style={{
        display:'flex', alignItems:'center', gap:4,
        background:'#FFFFFF', border:'1px solid #D5D9DE',
        borderRadius:8, padding:'5px 10px',
        fontFamily:FB, fontSize:13, fontWeight:600, color:'#606A76',
        cursor:'pointer', transition:'all 150ms', userSelect:'none' }}>
        {lang.toUpperCase()}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: open ? 'rotate(180deg)' : 'none', transition:'transform 150ms' }}>
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      {open && (
        <div style={{ position:'absolute', top:'calc(100% + 6px)', right:0,
          background:'#FFFFFF', border:'1px solid #D5D9DE',
          borderRadius:10, boxShadow:'0 4px 16px rgba(0,0,0,0.10),0 2px 4px rgba(0,0,0,0.06)',
          overflow:'hidden', zIndex:1000, minWidth:130 }}>
          {LANGS.map(({ code, label }) => (
            <button key={code} onClick={() => select(code)}
              style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                width:'100%', padding:'9px 14px', border:'none',
                background: lang===code ? '#F0F5F2' : 'transparent',
                color: lang===code ? '#3A7358' : '#14171A',
                fontFamily:FB, fontSize:13, fontWeight: lang===code ? 600 : 400,
                cursor:'pointer', textAlign:'left', gap:10, transition:'background 100ms' }}
              onMouseEnter={e => { if (lang!==code) e.currentTarget.style.background='#E8EAEC'; }}
              onMouseLeave={e => { if (lang!==code) e.currentTarget.style.background='transparent'; }}>
              <span>{label}</span>
              <span style={{ fontFamily:FB, fontSize:11, fontWeight:600,
                color: lang===code ? '#3A7358' : '#9AA2AD',
                letterSpacing:'0.05em' }}>{code.toUpperCase()}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ─── BRAND PANEL ─────────────────────────────────────────────── */
function BrandPanel({ theme, showCopy }) {
  const th = {
    verde:  { bg: C.primary,   text: '#fff', sub: 'rgba(255,255,255,0.68)', div: 'rgba(255,255,255,0.28)', wm: 'rgba(255,255,255,0.06)', italic: 'rgba(255,255,255,0.9)' },
    marino: { bg: C.accent,    text: '#fff', sub: 'rgba(255,255,255,0.68)', div: 'rgba(255,255,255,0.28)', wm: 'rgba(255,255,255,0.06)', italic: 'rgba(255,255,255,0.9)' },
    claro:  { bg: C.bgSurface, text: C.fgPrimary, sub: C.fgSecondary, div: C.border, wm: C.bgSubtle, italic: C.primary },
  }[theme] || {};
  return (
    <div className="brand-col" style={{ background: th.bg, display: 'flex',
      flexDirection: 'column', justifyContent: 'space-between',
      padding: '56px 52px', position: 'relative', overflow: 'hidden',
      borderRight: theme === 'claro' ? `1px solid ${C.border}` : 'none' }}>
      {/* Watermark */}
      <div style={{ position: 'absolute', bottom: -24, right: -12, fontFamily: FD,
        fontSize: 200, fontWeight: 700, lineHeight: 1, color: th.wm,
        whiteSpace: 'nowrap', userSelect: 'none', pointerEvents: 'none', letterSpacing: '-0.04em' }}>
        nlv
      </div>
      {/* Content */}
      <div style={{ position: 'relative', zIndex: 1 }}>
        <div style={{ fontFamily: FD, fontSize: 44, fontWeight: 700,
          color: th.text, letterSpacing: '-0.02em', lineHeight: 1, marginBottom: 22 }}>
          no lo vendo
        </div>
        <div style={{ width: 48, height: 1, background: th.div, marginBottom: 22 }}></div>
        <div style={{ fontFamily: FD, fontSize: 19, fontStyle: 'italic',
          color: th.italic, lineHeight: 1.45, marginBottom: showCopy ? 24 : 0 }}>
          "No lo vendo, lo regalo."
        </div>
        {showCopy && (
          <p style={{ fontFamily: FB, fontSize: 15, lineHeight: 1.75,
            color: th.sub, maxWidth: 320, fontWeight: 300 }}>
            Un sistema comunitario donde los objetos encuentran un nuevo dueño. Sin dinero. Solo reputación.
          </p>
        )}
      </div>
      {/* Footer */}
      <div style={{ position: 'relative', zIndex: 1,
        fontFamily: FB, fontSize: 12, color: th.sub, letterSpacing: '0.02em' }}>
        España · MVP 2025
      </div>
    </div>
  );
}

/* ─── FORM PANEL ──────────────────────────────────────────────── */
function FormPanel({ centered, children }) {
  return (
    <div style={{ background: C.bgPage, display: 'flex', alignItems: 'center',
      justifyContent: 'center', padding: '48px 24px',
      minHeight: centered ? '100vh' : undefined, position: 'relative' }}>
      <div style={{ position: 'absolute', top: 16, right: 20 }}>
        <LanguageSelector />
      </div>
      <div style={{ width: '100%', maxWidth: 400 }}>
        {centered && (
          <div style={{ textAlign: 'center', marginBottom: 32 }}>
            <div style={{ fontFamily: FD, fontSize: 30, fontWeight: 700, color: C.primary,
              letterSpacing: '-0.02em', marginBottom: 6 }}>no lo vendo</div>
            <div style={{ fontFamily: FD, fontSize: 14, fontStyle: 'italic', color: C.fgSecondary }}>
              No lo vendo, lo regalo.
            </div>
          </div>
        )}
        <div style={{ background: C.bgSurface, borderRadius: 12,
          border: `1px solid ${C.border}`,
          boxShadow: centered ? C.sh1 : C.sh2,
          padding: '28px 28px 24px' }}>
          {children}
        </div>
        <p style={{ fontFamily: FB, fontSize: 12, color: C.fgMuted, marginTop: 20,
          textAlign: 'center', lineHeight: 1.65 }}>
          El acceso a objetos depende de tu reputación en la comunidad.
        </p>
      </div>
    </div>
  );
}

/* ─── SUCCESS ─────────────────────────────────────────────────── */
function SuccessState({ onBack }) {
  return (
    <div style={{ minHeight: '100vh', background: C.bgPage, display: 'flex',
      alignItems: 'center', justifyContent: 'center',
      flexDirection: 'column', textAlign: 'center', padding: 24, gap: 12 }}>
      <div style={{ width: 60, height: 60, borderRadius: '50%', background: C.primaryLight,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        marginBottom: 8, color: C.primary }}>
        <ICheck />
      </div>
      <div style={{ fontFamily: FD, fontSize: 28, fontWeight: 600, color: C.fgPrimary }}>Bienvenido/a</div>
      <p style={{ fontFamily: FB, fontSize: 14, color: C.fgMuted, maxWidth: 280, lineHeight: 1.65 }}>
        Sesión iniciada. Ya puedes explorar objetos disponibles en tu zona.
      </p>
      <div style={{ marginTop: 8, display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
        <a href="Explorar v3.html" style={{ textDecoration: 'none' }}>
          <Btn>Explorar objetos</Btn>
        </a>
        <Btn variant="secondary" onClick={onBack}>Volver al login</Btn>
      </div>
    </div>
  );
}

/* ─── APP ─────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "login",
  "layout": "dividida",
  "panelTheme": "verde",
  "showCopy": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [success, setSuccess] = React.useState(false);

  if (success) return <SuccessState onBack={() => setSuccess(false)} />;

  return (
    <div style={{ height: '100%' }}>
      {t.layout === 'centrada' ? (
        <FormPanel centered>
          <AuthForm screenTweak={t.screen} onSuccess={() => setSuccess(true)} />
        </FormPanel>
      ) : (
        <div className="split-grid"
          style={{ display: 'grid', gridTemplateColumns: '44% 56%', minHeight: '100vh' }}>
          <BrandPanel theme={t.panelTheme} showCopy={t.showCopy} />
          <FormPanel>
            <AuthForm screenTweak={t.screen} onSuccess={() => setSuccess(true)} />
          </FormPanel>
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="Pantalla activa" />
        <TweakRadio label="Estado" value={t.screen}
          options={['login','register','forgot','forgot-sent','reset','reset-invalid','expired']}
          onChange={v => setTweak('screen', v)} />
        <TweakSection label="Diseño" />
        <TweakRadio label="Disposición" value={t.layout}
          options={['dividida','centrada']}
          onChange={v => setTweak('layout', v)} />
        <TweakSection label="Panel izquierdo" />
        <TweakRadio label="Color" value={t.panelTheme}
          options={['verde','marino','claro']}
          onChange={v => setTweak('panelTheme', v)} />
        <TweakToggle label="Mostrar descripción" value={t.showCopy}
          onChange={v => setTweak('showCopy', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
