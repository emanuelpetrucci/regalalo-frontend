<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    background: #14171A;
  }

  @keyframes slideInRight  { from { transform: translateX( 60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideInLeft   { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideOutLeft  { from { transform: none; opacity: 1; } to { transform: translateX(-60px); opacity: 0; } }
  @keyframes slideOutRight { from { transform: none; opacity: 1; } to { transform: translateX( 60px); opacity: 0; } }

  .enter-fwd  { animation: slideInRight  340ms cubic-bezier(.22,.68,0,1.1) both; }
  .enter-back { animation: slideInLeft   340ms cubic-bezier(.22,.68,0,1.1) both; }
  .exit-fwd   { animation: slideOutLeft  260ms cubic-bezier(.4, 0,.6, 1)   both; }
  .exit-back  { animation: slideOutRight 260ms cubic-bezier(.4, 0,.6, 1)   both; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp 420ms cubic-bezier(.22,.68,0,1.1) both; }
  .fade-up-1 { animation-delay:  80ms; }
  .fade-up-2 { animation-delay: 160ms; }
  .fade-up-3 { animation-delay: 240ms; }
  .fade-up-4 { animation-delay: 320ms; }
  .fade-up-5 { animation-delay: 400ms; }

  @keyframes countUp { from { opacity: 0; transform: scale(.85) translateY(10px); } to { opacity: 1; transform: none; } }
  .count-up { animation: countUp 500ms cubic-bezier(.22,.68,0,1.2) 200ms both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

/* ── TOKENS ─────────────────────────────────────────────────── */
const C = {

  greenHov:  '#2D5C45',
  greenDk:   '#284f3d',
  navy:      '#253F72',
  navyDk:    '#1a2e52',

  fg:        '#14171A',

        <div className="fade-up fade-up-1"
          style={{ fontFamily: FB, fontSize: 'clamp(11px,1.1vw,13px)', fontWeight: 500,

/* ── SLIDE 2 — Roles ────────────────────────────────────────── */

        borderRadius: 8, padding: '8px 14px', textAlign: 'center',
        fontFamily: FB, fontSize: 'clamp(14px,1.5vw,18px)', fontWeight: 600,

    <div style={{ height: '100%', background: C.navy, display: 'flex',

          <h2 className="fade-up fade-up-2"

/* ── LANGUAGE SELECTOR ───────────────────────────────────────── */
const LANGS = [
  { code: 'es', label: 'Español' },
  { code: 'en', label: 'English' },
  { code: 'ca', label: 'Català'  },
];
function LanguageSelector({ dark }) {
  const [lang, setLang] = React.useState(() => localStorage.getItem('nlv_lang') || 'es');
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const select = code => { setLang(code); localStorage.setItem('nlv_lang', code); setOpen(false); };
  return (
    <div ref={ref} style={{ position:'relative', flexShrink:0 }}>
      <button onClick={() => setOpen(o => !o)} style={{
        display:'flex', alignItems:'center', gap:4,
        background: dark ? 'rgba(255,255,255,0.12)' : '#FFFFFF',
        border: `1px solid ${dark ? 'rgba(255,255,255,0.22)' : '#D5D9DE'}`,
        borderRadius:8, padding:'5px 10px',
        fontFamily:FB, fontSize:13, fontWeight:600,
        color: dark ? 'rgba(255,255,255,0.85)' : '#606A76',
        cursor:'pointer', transition:'all 150ms', userSelect:'none' }}>
        {lang.toUpperCase()}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: open ? 'rotate(180deg)' : 'none', transition:'transform 150ms' }}>
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      {open && (
        <div style={{ position:'absolute', top:'calc(100% + 6px)', right:0,
          background:'#FFFFFF', border:'1px solid #D5D9DE',
          borderRadius:10, boxShadow:'0 4px 16px rgba(0,0,0,0.10),0 2px 4px rgba(0,0,0,0.06)',
          overflow:'hidden', zIndex:1000, minWidth:130 }}>
          {LANGS.map(({ code, label }) => (
            <button key={code} onClick={() => select(code)}
              style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                width:'100%', padding:'9px 14px', border:'none',
                background: lang===code ? '#F0F5F2' : 'transparent',
                color: lang===code ? '#3A7358' : '#14171A',
                fontFamily:FB, fontSize:13, fontWeight: lang===code ? 600 : 400,
                cursor:'pointer', textAlign:'left', gap:10, transition:'background 100ms' }}
              onMouseEnter={e => { if (lang!==code) e.currentTarget.style.background='#E8EAEC'; }}
              onMouseLeave={e => { if (lang!==code) e.currentTarget.style.background='transparent'; }}>
              <span>{label}</span>
              <span style={{ fontFamily:FB, fontSize:11, fontWeight:600,
                color: lang===code ? '#3A7358' : '#9AA2AD',
                letterSpacing:'0.05em' }}>{code.toUpperCase()}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── PROGRESS BAR ───────────────────────────────────────────── */
function ProgressBar({ total, current, dark }) {
  return (
    <div style={{ display: 'flex', gap: 5 }}>
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} style={{ height: 3, flex: 1, borderRadius: 2,
          background: i <= current
            ? (dark ? 'rgba(255,255,255,0.85)' : C.green)
            : (dark ? 'rgba(255,255,255,0.22)' : C.border),
          transition: 'background 250ms' }} />
      ))}
    </div>
  );
}

/* ── ONBOARDING SHELL ───────────────────────────────────────── */
const SLIDES_META = [
  { dark: true  },
  { dark: false },
  { dark: true  },
  { dark: false },
  { dark: true  },
];

function OnboardingShell({ startAt }) {
  const [idx, setIdx]         = React.useState(startAt);
  const [dir, setDir]         = React.useState(1);
  const [key, setKey]         = React.useState(0);
  const [done, setDone]       = React.useState(false);

  // sync startAt from tweak
  React.useEffect(() => {
    setIdx(startAt);
    setKey(k => k + 1);
  }, [startAt]);

  const dark = SLIDES_META[idx]?.dark ?? false;

  const go = React.useCallback((delta) => {
    setDir(delta);
    setKey(k => k + 1);
    setIdx(i => Math.max(0, Math.min(SLIDES_META.length - 1, i + delta)));
  }, []);

  const finish = React.useCallback(() => setDone(true), []);

  // keyboard
  React.useEffect(() => {
    const onKey = e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  go(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    go(-1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go]);

  if (done) return <DoneScreen onBack={() => { setDone(false); setIdx(0); setKey(k=>k+1); }} />;

  const slideComponents = [
    <Slide1 />,
    <Slide2 />,
    <Slide3 />,
    <Slide4 />,
    <Slide5 onFinish={finish} />,
  ];

  const fgNav = dark ? 'rgba(255,255,255,0.7)' : C.fgMuted;
  const enterCls = dir >= 0 ? 'enter-fwd' : 'enter-back';

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column',
      position: 'relative', overflow: 'hidden' }}>

      {/* Top chrome */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 20,
        padding: 'clamp(16px,2.5vh,28px) clamp(20px,4vw,52px)',
        display: 'flex', alignItems: 'center', gap: 20 }}>

        {/* Logo */}
        <div style={{ fontFamily: FD, fontSize: 'clamp(14px,1.4vw,18px)', fontWeight: 700,
          color: dark ? '#fff' : C.green, letterSpacing: '-0.02em',
          flex: '0 0 auto', whiteSpace: 'nowrap' }}>
          no lo vendo
        </div>

        {/* Progress */}
        <div style={{ flex: 1, maxWidth: 360 }}>
          <ProgressBar total={SLIDES_META.length} current={idx} dark={dark} />
        </div>

        {/* Skip */}
        {idx < SLIDES_META.length - 1 && (
          <button onClick={finish}
            style={{ background: 'none', border: 'none', cursor: 'pointer',
              fontFamily: FB, fontSize: 13, fontWeight: 500, color: fgNav,
              padding: 0, flexShrink: 0 }}>
            Omitir
          </button>
        )}
        {/* Slide counter */}
        <div style={{ fontFamily: FB, fontSize: 12, color: fgNav, flexShrink: 0, whiteSpace: 'nowrap' }}>
          {idx + 1} / {SLIDES_META.length}
        </div>
        <LanguageSelector dark={dark} />
      </div>

      {/* Slide */}
      <div key={key} className={enterCls} style={{ flex: 1, minHeight: 0 }}>
        {slideComponents[idx]}
      </div>

      {/* Bottom nav */}
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 20,
        padding: 'clamp(16px,2.5vh,28px) clamp(20px,4vw,52px)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

        {/* Back */}
        <button onClick={() => go(-1)} disabled={idx === 0}
          style={{ background: 'none', border: 'none', cursor: idx === 0 ? 'default' : 'pointer',
            opacity: idx === 0 ? 0 : 1, pointerEvents: idx === 0 ? 'none' : 'auto',
            display: 'flex', alignItems: 'center', gap: 6,
            fontFamily: FB, fontSize: 13, color: fgNav, padding: 0, transition: 'opacity 200ms' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Anterior
        </button>

        {/* Next — hidden on last slide (has its own CTA) */}
        {idx < SLIDES_META.length - 1 && (
          <button onClick={() => go(1)}
            style={{ display: 'flex', alignItems: 'center', gap: 6,
              background: dark ? 'rgba(255,255,255,0.15)' : C.green,
              border: dark ? '1px solid rgba(255,255,255,0.25)' : 'none',
              color: '#fff', borderRadius: 8, cursor: 'pointer',
              fontFamily: FB, fontSize: 13, fontWeight: 500,
              padding: '9px 18px', transition: 'background 150ms' }}>
            Siguiente
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        )}
      </div>
    </div>
  );
}

/* ── APP ─────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startSlide": 5
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <div style={{ height: '100%' }}>
      <OnboardingShell startAt={t.startSlide - 1} />
      <TweaksPanel>
        <TweakSection label="Vista previa" />
        <TweakSelect label="Slide inicial"
          value={t.startSlide}
          options={[
            { label: '1 — Concepto',     value: 1 },
            { label: '2 — Roles',         value: 2 },
            { label: '3 — Reputación',    value: 3 },
            { label: '4 — Límites',       value: 4 },
            { label: '5 — Radio + CTA',   value: 5 },
          ]}
          onChange={v => setTweak('startSlide', Number(v))} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
