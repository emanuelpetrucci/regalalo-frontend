<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframes — No lo vendo, lo regalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f3ef; font-family: 'Space Mono', monospace; }
</style>
</head>
<body>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
/* ─────────────────────────────────────────────
   DESIGN TOKENS — wireframe aesthetic
───────────────────────────────────────────── */
const T = {
  bg:      '#faf9f6',
  bg2:     '#f0ede6',
  line:    '#1a1a1a',
  dim:     '#888',
  ghost:   '#ccc',
  accent:  '#d4622a',
  accentL: '#f5e6dc',
  white:   '#fff',
  font:    "'Space Mono', monospace",
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAnnotations": true,
  "showDesktopHints": true,
  "accentColor": "#d4622a",
  "mobileWidth": 390
}/*EDITMODE-END*/;

/* ─────────────────────────────────────────────
   PRIMITIVES
───────────────────────────────────────────── */
const wBox = (extra={}) => ({
  background: T.white,
  border: `1.5px solid ${T.line}`,
  fontFamily: T.font,
  ...extra,
});

const wLabel = (extra={}) => ({
  fontFamily: T.font,
  fontSize: 9,
  color: T.dim,
  letterSpacing: '0.08em',
  textTransform: 'uppercase',
  ...extra,
});

function Rect({ w, h, label, sub, fill, style={} }) {
  return (
    <div style={{ width: w, height: h, background: fill||T.bg2, border:`1.5px solid ${T.ghost}`,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      gap:2, flexShrink:0, ...style }}>
      {label && <span style={{ fontFamily:T.font, fontSize:9, color:T.dim, textTransform:'uppercase', letterSpacing:'0.08em' }}>{label}</span>}
      {sub && <span style={{ fontFamily:T.font, fontSize:8, color:T.ghost }}>{sub}</span>}
    </div>
  );
}

function Chip({ label, accent, small }) {
  return (
    <span style={{ display:'inline-flex', alignItems:'center', padding: small ? '1px 5px' : '2px 7px',
      border:`1.5px solid ${accent ? T.accent : T.line}`, borderRadius:2,
      fontFamily:T.font, fontSize: small ? 8 : 9, color: accent ? T.accent : T.line,
      background: accent ? T.accentL : 'transparent', flexShrink:0 }}>
      {label}
    </span>
  );
}

function Tag({ label, muted }) {
  return (
    <span style={{ display:'inline-flex', padding:'1px 5px',
      background: muted ? T.bg2 : T.line, border:`1.5px solid ${muted?T.ghost:T.line}`,
      fontFamily:T.font, fontSize:8, color: muted ? T.dim : T.white,
      borderRadius:1, flexShrink:0 }}>
      {label}
    </span>
  );
}

function Divider({ my=8 }) {
  return <div style={{ height:1, background:T.ghost, margin:`${my}px 0` }} />;
}

function Annotation({ children, right }) {
  return (
    <div style={{ position:'absolute', [right?'right':'left']:-8, top:'50%', transform:'translateY(-50%)',
      background:T.accentL, border:`1px solid ${T.accent}`, borderRadius:2,
      padding:'3px 7px', fontFamily:T.font, fontSize:8, color:T.accent,
      whiteSpace:'nowrap', pointerEvents:'none', zIndex:10,
      [right?'marginRight':'marginLeft']: 12 }}>
      ← {children}
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, letterSpacing:'0.12em',
      textTransform:'uppercase', marginBottom:12, display:'flex', alignItems:'center', gap:8 }}>
      <div style={{ flex:1, height:1, background:T.ghost }} />
      {children}
      <div style={{ flex:1, height:1, background:T.ghost }} />
    </div>
  );
}

function VariantLabel({ letter, title, desc }) {
  return (
    <div style={{ marginBottom:10 }}>
      <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
        <span style={{ fontFamily:T.font, fontSize:11, fontWeight:700, color:T.accent }}>#{letter}</span>
        <span style={{ fontFamily:T.font, fontSize:11, fontWeight:700, color:T.line }}>{title}</span>
      </div>
      {desc && <div style={{ fontFamily:T.font, fontSize:9, color:T.dim, marginTop:2 }}>{desc}</div>}
    </div>
  );
}

/* ─────────────────────────────────────────────
   PHONE SHELL
───────────────────────────────────────────── */
function Phone({ children, label, w=390, scale=1 }) {
  const sw = w * scale;
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
      <div style={{ width: sw, transform:`scale(${scale})`, transformOrigin:'top center',
        background: T.bg, border:`2px solid ${T.line}`, borderRadius:8, overflow:'hidden',
        boxShadow:'3px 3px 0 '+T.line, fontFamily:T.font }}>
        {/* status bar */}
        <div style={{ background:T.line, padding:'6px 16px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:T.white, fontSize:9, fontFamily:T.font }}>09:41</span>
          <span style={{ color:T.white, fontSize:9, fontFamily:T.font }}>▐▐▐ ◉</span>
        </div>
        {children}
      </div>
      {label && <span style={{ fontFamily:T.font, fontSize:9, color:T.dim, letterSpacing:'0.08em', textTransform:'uppercase' }}>{label}</span>}
    </div>
  );
}

/* ─────────────────────────────────────────────
   BOTTOM NAV — 3 patterns
───────────────────────────────────────────── */
function BottomNavA({ active='explore' }) {
  const items = [
    { id:'explore', icon:'◎', label:'Explorar' },
    { id:'donate', icon:'+', label:'Regalar' },
    { id:'profile', icon:'○', label:'Yo' },
  ];
  return (
    <div style={{ borderTop:`1.5px solid ${T.line}`, display:'flex', background:T.white }}>
      {items.map(i=>(
        <div key={i.id} style={{ flex:1, padding:'8px 0 10px', display:'flex', flexDirection:'column',
          alignItems:'center', gap:2 }}>
          <span style={{ fontSize:16, color: i.id===active ? T.accent : T.ghost }}>{i.icon}</span>
          <span style={{ fontFamily:T.font, fontSize:8, color: i.id===active ? T.accent : T.dim,
            fontWeight: i.id===active ? 700 : 400 }}>{i.label}</span>
        </div>
      ))}
    </div>
  );
}

function BottomNavB({ active='explore' }) {
  const items = [
    { id:'explore', icon:'⊞', label:'Inicio' },
    { id:'requests', icon:'⊙', label:'Solicitudes' },
    { id:'donate', icon:'+', label:'Publicar' },
    { id:'sessions', icon:'◈', label:'Entregas' },
    { id:'profile', icon:'◯', label:'Yo' },
  ];
  return (
    <div style={{ borderTop:`1.5px solid ${T.line}`, display:'flex', background:T.white }}>
      {items.map(i=>(
        <div key={i.id} style={{ flex:1, padding:'6px 0 10px', display:'flex', flexDirection:'column',
          alignItems:'center', gap:1 }}>
          <span style={{ fontSize:14, color: i.id===active ? T.accent : T.ghost }}>{i.icon}</span>
          <span style={{ fontFamily:T.font, fontSize:7, color: i.id===active ? T.accent : T.dim,
            fontWeight: i.id===active ? 700 : 400 }}>{i.label}</span>
        </div>
      ))}
    </div>
  );
}

function BottomNavC({ active='explore' }) {
  // FAB central style
  const items = [
    { id:'explore', icon:'⊞', label:'Explorar' },
    { id:'profile', icon:'◯', label:'Perfil' },
  ];
  return (
    <div style={{ borderTop:`1.5px solid ${T.line}`, display:'flex', background:T.white, position:'relative' }}>
      {/* left */}
      <div style={{ flex:1, padding:'8px 0 10px', display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
        <span style={{ fontSize:14, color: active==='explore' ? T.accent : T.ghost }}>⊞</span>
        <span style={{ fontFamily:T.font, fontSize:7, color: active==='explore' ? T.accent : T.dim }}>Explorar</span>
      </div>
      {/* FAB */}
      <div style={{ flex:0, width:56, position:'relative', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ position:'absolute', top:-20, width:44, height:44, borderRadius:'50%',
          background:T.line, border:`2px solid ${T.line}`, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ color:T.white, fontSize:20, lineHeight:1 }}>+</span>
        </div>
      </div>
      {/* right */}
      <div style={{ flex:1, padding:'8px 0 10px', display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
        <span style={{ fontSize:14, color: active==='profile' ? T.accent : T.ghost }}>◯</span>
        <span style={{ fontFamily:T.font, fontSize:7, color: active==='profile' ? T.accent : T.dim }}>Perfil</span>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   SECTION 0 — NAVEGACIÓN GLOBAL (Variante A)
───────────────────────────────────────────── */
function NavSectionA({ tweaks }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:24 }}>
      <SectionLabel>0 — Navegación Global · Variante A</SectionLabel>
      <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, marginBottom:4 }}>
        3 tabs: Explorar / Regalar / Yo. Interesado-first. Mínima carga cognitiva en onboarding.
      </div>
      <div style={{ display:'flex', gap:40, flexWrap:'wrap', alignItems:'flex-start' }}>

        {/* Shell con Explorar activo */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, textTransform:'uppercase', letterSpacing:'0.08em' }}>Tab: Explorar</div>
          <Phone w={280} scale={1}>
            <div style={{ padding:'12px 14px', background:T.bg }}>
              <div style={{ fontFamily:T.font, fontSize:13, fontWeight:700, marginBottom:10 }}>Tablón</div>
              <div style={{ ...wBox(), padding:'8px 10px', marginBottom:8, display:'flex', gap:6, alignItems:'center' }}>
                <span style={{ fontSize:10, color:T.dim }}>⊕</span>
                <span style={{ fontFamily:T.font, fontSize:10, color:T.ghost }}>Cerca de ti…</span>
              </div>
              <Rect w="100%" h={160} label="feed de objetos" />
            </div>
            <BottomNavA active='explore' />
          </Phone>
        </div>

        {/* Shell con Publicar activo */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, textTransform:'uppercase', letterSpacing:'0.08em' }}>Tab: Publicar</div>
          <Phone w={280} scale={1}>
            <div style={{ padding:'12px 14px', background:T.bg }}>
              <div style={{ fontFamily:T.font, fontSize:13, fontWeight:700, marginBottom:10 }}>Regalar algo</div>
              <Rect w="100%" h={160} label="formulario de publicación" />
            </div>
            <BottomNavA active='donate' />
          </Phone>
        </div>

        {/* Shell con Perfil activo */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, textTransform:'uppercase', letterSpacing:'0.08em' }}>Tab: Perfil</div>
          <Phone w={280} scale={1}>
            <div style={{ padding:'12px 14px', background:T.bg }}>
              <div style={{ fontFamily:T.font, fontSize:13, fontWeight:700, marginBottom:10 }}>Mi cuenta</div>
              <Rect w="100%" h={160} label="reputación + historial" />
            </div>
            <BottomNavA active='profile' />
          </Phone>
        </div>

        {/* Anotaciones arquitectura */}
        <div style={{ display:'flex', flexDirection:'column', gap:10, maxWidth:300 }}>
          <div style={{ fontFamily:T.font, fontSize:10, color:T.dim, textTransform:'uppercase', letterSpacing:'0.08em' }}>Arquitectura de pantallas</div>
          {[
            ['Explorar', 'Tablón → Detalle → Me interesa'],
            ['Regalar', 'Formulario → Fotos → Publicado → Mis regalos → Interesados → Acuerdo'],
            ['Yo', 'Stats → Mis regalos / Mis turnos / Historial'],
          ].map(([tab, screens]) => (
            <div key={tab} style={{ ...wBox(), padding:'10px 12px' }}>
              <div style={{ fontFamily:T.font, fontSize:10, fontWeight:700, marginBottom:4 }}>{tab}</div>
              <div style={{ fontFamily:T.font, fontSize:9, color:T.dim, lineHeight:1.7 }}>{screens}</div>
            </div>
          ))}
          {tweaks.showDesktopHints && (
            <div style={{ background:T.bg2, border:`1.5px dashed ${T.ghost}`, borderRadius:4, padding:'8px 10px' }}>
              <div style={{ fontFamily:T.font, fontSize:9, color:T.dim, fontWeight:700, marginBottom:3, textTransform:'uppercase', letterSpacing:'0.1em' }}>Desktop</div>
              <div style={{ fontFamily:T.font, fontSize:9, color:T.dim }}>
                Top nav: logo izq · Explorar · Publicar objeto (CTA) · Perfil der. Bottom nav desaparece. Feed → grid 3 cols.
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   SECTION 1 — LISTADO (3 variaciones)
───────────────────────────────────────────── */
function ItemCard({ title, condition, dist, degraded, img=true }) {
  return (
    <div style={{ ...wBox(), marginBottom:8, display:'flex', gap:10, padding:10, position:'relative' }}>
      {img && <Rect w={60} h={60} label="img" style={{ flexShrink:0, borderRadius:2 }} />}
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:4 }}>
        <div style={{ display:'flex', alignItems:'flex-start', gap:4, flexWrap:'wrap' }}>
          <span style={{ fontFamily:T.font, fontSize:11, fontWeight:700, lineHeight:1.3 }}>{title}</span>
          {degraded && <Tag label="Lleva tiempo aquí" muted />}
        </div>
        <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
          <Chip label={condition} small />
          <Chip label={dist} small />
        </div>
      </div>
    </div>
  );
}

function ItemCardGrid({ title, condition, dist }) {
  return (
    <div style={{ ...wBox(), display:'flex', flexDirection:'column', overflow:'hidden', borderRadius:2 }}>
      <Rect w="100%" h={90} label="imagen" />
      <div style={{ padding:'8px 8px 10px', display:'flex', flexDirection:'column', gap:4 }}>
        <span style={{ fontFamily:T.font, fontSize:10, fontWeight:700 }}>{title}</span>
        <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
          <Chip label={condition} small />
          <Chip label={dist} small />
        </div>
      </div>
    </div>
  );
}

function ListSection({ tweaks }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:24 }}>
      <SectionLabel>1 — Listado de Objetos</SectionLabel>

      <div style={{ display:'flex', gap:32, flexWrap:'wrap', alignItems:'flex-start' }}>

        {/* VAR A — Lista vertical */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <VariantLabel letter="A" title="Lista vertical" desc="Una columna. Más info por ítem. Escaneado rápido." />
          <Phone w={320} scale={1}>
            <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:0 }}>
              {/* search */}
              <div style={{ ...wBox(), padding:'8px 10px', marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ fontSize:10, color:T.dim }}>⊕</span>
                <span style={{ fontFamily:T.font, fontSize:10, color:T.ghost }}>¿Qué necesitas hoy?</span>
              </div>
              {/* filters */}
              <div style={{ display:'flex', gap:6, marginBottom:10, overflow:'hidden' }}>
                <Chip label="Todos" accent />
                <Chip label="Electrónica" />
                <Chip label="Ropa" />
                <Chip label="Hogar" />
              </div>
              {/* items */}
              <ItemCard title="Bicicleta de montaña" condition="Buen estado" dist="1.2 km" />
              <ItemCard title="Sofá 3 plazas gris" condition="Usado" dist="3.4 km" />
              <ItemCard title="Mesa escritorio" condition="Como nuevo" dist="0.8 km" degraded />
              <ItemCard title="Cámara analógica" condition="Buen estado" dist="4.1 km" />
            </div>
            <BottomNavA />
          </Phone>
        </div>

        {/* VAR B — Grid 2 cols */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <VariantLabel letter="B" title="Grid 2 columnas" desc="Imagen grande. Más impacto visual. Similar a marketplace." />
          <Phone w={320} scale={1}>
            <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:0 }}>
              <div style={{ ...wBox(), padding:'8px 10px', marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ fontSize:10, color:T.dim }}>⊕</span>
                <span style={{ fontFamily:T.font, fontSize:10, color:T.ghost }}>Cerca de ti…</span>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
                <ItemCardGrid title="Bicicleta" condition="Buen estado" dist="1.2 km" />
                <ItemCardGrid title="Sofá 3 plazas" condition="Usado" dist="3.4 km" />
                <ItemCardGrid title="Mesa escritorio" condition="Como nuevo" dist="0.8 km" />
                <ItemCardGrid title="Cámara" condition="Buen estado" dist="4.1 km" />
              </div>
            </div>
            <BottomNavA />
          </Phone>
          {tweaks.showAnnotations && (
            <div style={{ fontFamily:T.font, fontSize:9, color:T.dim, background:T.bg2,
              border:`1px solid ${T.ghost}`, borderRadius:2, padding:'4px 8px', maxWidth:320 }}>
              ↑ Riesgo: menos contexto por ítem; la condición y distancia compiten con la imagen
            </div>
          )}
        </div>

        {/* VAR C — Lista + mapa toggle */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <VariantLabel letter="C" title="Lista + mapa" desc="Toggle entre feed y mapa. Relevante para radio 50km." />
          <Phone w={320} scale={1}>
            <div style={{ padding:'12px 14px', display:'flex', flexDirection:'column', gap:0 }}>
              {/* search */}
              <div style={{ ...wBox(), padding:'8px 10px', marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ fontSize:10, color:T.dim }}>⊕</span>
                <span style={{ fontFamily:T.font, fontSize:10, color:T.ghost }}>¿Qué necesitas hoy?</span>
              </div>
              {/* toggle */}
              <div style={{ display:'flex', border:`1.5px solid ${T.line}`, borderRadius:3, marginBottom:10, overflow:'hidden' }}>
                <div style={{ flex:1, padding:'5px 0', textAlign:'center', background:T.line }}>
                  <span style={{ fontFamily:T.font, fontSize:9, color:T.white, fontWeight:700 }}>≡ Lista</span>
                </div>
                <div style={{ flex:1, padding:'5px 0', textAlign:'center', background:T.white }}>
                  <span style={{ fontFamily:T.font, fontSize:9, color:T.dim }}>⊕ Mapa</span>
                </div>
              </div>
              <ItemCard title="Bicicleta de montaña" condition="Buen estado" dist="1.2 km" />
              <ItemCard title="Sofá 3 plazas gris" condition="Usado" dist="3.4 km" />
              <ItemCard title="Mesa escritorio" condition="Como nuevo" dist="0.8 km" degraded />
            </div>
            <BottomNavA />
          </Phone>
          {tweaks.showAnnotations && (
            <div style={{ fontFamily:T.font, fontSize:9, color:T.accent, background:T.accentL,
              border:`1px solid ${T.accent}`, borderRadius:2, padding:'4px 8px', maxWidth:320 }}>
              ↑ Útil: la distancia es criterio clave del sistema (50km). El mapa hace eso tangible.
            </div>
          )}
        </div>
      </div>

      {tweaks.showDesktopHints && (
        <div style={{ background:T.bg2, border:`1.5px dashed ${T.ghost}`, borderRadius:4, padding:'10px 14px' }}>
          <div style={{ fontFamily:T.font, fontSize:9, color:T.dim, fontWeight:700, marginBottom:4, textTransform:'uppercase', letterSpacing:'0.1em' }}>Desktop hint</div>
          <div style={{ fontFamily:T.font, fontSize:9, color:T.dim }}>
            En desktop: Var A pasa a 2 cols; Var B a 3–4 cols; Var C: sidebar con lista + mapa 70% derecha. Filtros en barra superior horizontal.
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   SECTION 2 — DETALLE (2 variaciones)
───────────────────────────────────────────── */
function DetailSection({ tweaks }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:24 }}>
      <SectionLabel>2 — Detalle de Objeto</SectionLabel>
      <div style={{ display:'flex', gap:32, flexWrap:'wrap', alignItems:'flex-start' }}>

        {/* VAR A — imagen arriba, CTA fijo abajo */}
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          <VariantLabel letter="A" title="Hero image + CTA sticky" desc="Imagen ocupa 40% superior. Botón 'Solicitar' fijo abajo." />
          <Phone w={320} scale={1}>
            {/* hero img */}
            <Rect w="100%" h={160} label="imagen principal" sub="← → 4 más" style={{ borderRadius:0, border:'none', borderBottom:`1.5px solid ${T.line}` }} />
            <div style={{ padding:'14px 14px 0', display:'flex', flexDirection:'column', gap:10 }}>
              {/* back + title */}
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <span style={{ fontFamily:T.font, fontSize:10, color:T.dim }}>← Volver</span>
              </div>
              <div style={{ fontFamily:T.font, fontSize:14, fontWeight:700, lineHeight:1.3 }}>Bicicleta de montaña</div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                <Chip label="Buen estado" accent />
                <Chip label="1.2 km" />
                <Tag label="activo" />
              </div>
              <Divider my={4} />
              {/* donor */}
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <Rect w={32} h={32} label="◯" style={{ borderRadius:'50%', border:`1.5px solid ${T.line}` }} />
                <div>
                  <div style={{ fontFamily:T.font, fontSize:9, color:T.dim }}>Donante</div>
