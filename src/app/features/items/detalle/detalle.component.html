<section class="detalle-page" *transloco="let t">
  @if (itemSlug()) {
    <a
      routerLink="/explorar"
      class="detalle-page__back"
      [attr.aria-label]="t('items.detail.back')"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      {{ t('items.detail.back') }}
    </a>

    <app-item-detail-panel [itemId]="itemSlug()" presentation="page" />
  }
</section>
