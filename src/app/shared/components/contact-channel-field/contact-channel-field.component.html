<div
  class="contact-channel-field"
  [class.contact-channel-field--donor]="appearance() === 'donor'"
  [class.contact-channel-field--explore]="appearance() === 'explore'"
  [formGroup]="form"
  *transloco="let t"
>
  @if (showLabel()) {
    <label class="contact-channel-field__label" [attr.for]="inputId()">
      {{ t('items.my_objects.select_channel_label') }}
      <span class="contact-channel-field__required" aria-hidden="true">*</span>
    </label>
  }

  <div
    class="contact-channel-field__type-pills"
    role="group"
    [attr.aria-label]="t('items.my_objects.select_channel_label')"
  >
    @for (type of channelTypes; track type) {
      <button
        type="button"
        class="contact-channel-field__type-pill"
        [class.contact-channel-field__type-pill--active]="form.controls.channelType.value === type"
        [attr.aria-pressed]="form.controls.channelType.value === type"
        [disabled]="disabled()"
        (click)="setChannelType(type)"
      >
        {{ t(channelTypeLabelKey(type)) }}
      </button>
    }
  </div>

  <div
    class="contact-channel-field__input-wrap"
    [class.contact-channel-field__input-wrap--error]="showChannelError()"
    [class.contact-channel-field__input-wrap--valid]="
      !showChannelError() && form.controls.channelValue.value.trim().length >= 4
    "
  >
    @if (form.controls.channelType.value !== 'email') {
      <span class="contact-channel-field__input-icon" aria-hidden="true">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
        >
          <path
            d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"
          />
        </svg>
      </span>
    } @else {
      <span class="contact-channel-field__input-icon" aria-hidden="true">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
        >
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-10 5L2 7" />
        </svg>
      </span>
    }
    <span class="contact-channel-field__prefix" aria-hidden="true">{{ channelPrefix() }}</span>
    <input
      [id]="inputId()"
      class="contact-channel-field__input"
      type="text"
      formControlName="channelValue"
      [placeholder]="t(channelPlaceholderKey(form.controls.channelType.value))"
      [disabled]="disabled()"
      (input)="onChannelValueInput()"
    />
  </div>

  @if (showChannelError()) {
    <p class="contact-channel-field__field-error" role="alert">
      {{ t('items.my_objects.select_channel_required') }}
    </p>
  }
</div>
