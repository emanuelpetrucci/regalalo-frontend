@if (open()) {
  <div
    class="share-dialog"
    role="presentation"
    (click)="onBackdropClick($event)"
    [attr.data-ga-context]="gaContext()"
  >
    <div
      #panel
      class="share-dialog__panel"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-label]="'items.share.title' | transloco"
    >
      <header class="share-dialog__header">
        <h2 class="share-dialog__title">{{ 'items.share.title' | transloco }}</h2>
        <button
          type="button"
          class="share-dialog__close"
          [attr.aria-label]="'items.share.close' | transloco"
          data-ga-id="share_dialog_close"
          [attr.data-ga-context]="gaContext()"
          (click)="close()"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </header>

      @if (title(); as itemTitle) {
        <p class="share-dialog__item-title">{{ itemTitle }}</p>
      }

      <div class="share-dialog__networks">
        @for (network of networks(); track network.id) {
          <a
            class="share-dialog__network"
            target="_blank"
            rel="noopener noreferrer"
            [href]="network.href"
            [attr.data-ga-id]="'share_dialog_network_' + network.id"
            [attr.data-ga-context]="gaContext()"
          >
            <span class="share-dialog__network-icon" [class]="'share-dialog__network-icon--' + network.id" aria-hidden="true">
              @if (network.id === 'whatsapp') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347zM12 0C5.373 0 0 5.373 0 12c0 2.116.553 4.103 1.52 5.83L0 24l6.336-1.51A11.96 11.96 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.89 0-3.66-.5-5.19-1.38l-.37-.22-3.76.9.94-3.67-.24-.38A9.934 9.934 0 012 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10z"/>
                </svg>
              } @else if (network.id === 'facebook') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.728-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
              }
            </span>
            {{ network.label }}
          </a>
        }
      </div>

      <div class="share-dialog__copy-row">
        <div class="share-dialog__url">{{ copyTrackedUrl() }}</div>
        <button
          type="button"
          class="share-dialog__copy"
          [class.share-dialog__copy--done]="copied()"
          data-ga-id="share_dialog_copy_link"
          [attr.data-ga-context]="gaContext()"
          (click)="copyUrl()"
        >
          @if (copied()) {
            {{ 'items.share.copied' | transloco }}
          } @else {
            {{ 'items.share.copy' | transloco }}
          }
        </button>
      </div>
    </div>
  </div>
}
